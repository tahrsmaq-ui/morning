<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رسالة صباحية</title>
  <style>
    /* التنسيقات العامة والخطوط */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      /* خلفية دافئة بتدرج ألوان شروق الشمس والصباح */
      background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 50%, #ffcc80 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #4a3b32;
    }

    /* الحاوية الرئيسية */
    .container {
      width: 100%;
      max-width: 500px;
      position: relative;
    }

    /* الشاشة الأولى: البطاقة البدائية */
    .start-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      padding: 40px 25px;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(211, 140, 80, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.6);
      text-align: center;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .sun-icon {
      font-size: 2.5rem;
      margin-bottom: 15px;
      display: inline-block;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .start-btn {
      background: linear-gradient(45deg, #ff9800, #ffb74d);
      color: #ffffff;
      border: none;
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(255, 152, 0, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(255, 152, 0, 0.4);
    }

    /* الشاشة الثانية: ورقة الرسالة الصباحية */
    .letter-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      padding: 35px 28px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(200, 130, 70, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.8);
      line-height: 1.9;
      font-size: 1rem;
      color: #3e2723;
      display: none;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
      max-height: 80vh;
      overflow-y: auto;
    }

    /* تحسين شكل شريط التمرير */
    .letter-card::-webkit-scrollbar {
      width: 6px;
    }
    .letter-card::-webkit-scrollbar-thumb {
      background: #ffb74d;
      border-radius: 10px;
    }

    .hidden {
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
    }

    .show {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="start-card" id="startCard">
      <div class="sun-icon">☀️</div>
      <br>
      <button class="start-btn" onclick="showMessage()">صباح الخير.. اضغطي هنا</button>
    </div>

    <div class="letter-card" id="letterCard">
      <p>
        صباح الخير والهدوء.. ☀️<br><br>
        اكتبي هنا رسالتك الصباحية أو أمنياتك لهذا اليوم. التصميم يمنح شعوراً بالدفء والإشراق ومناسب تماماً لمشاركته في أوقات الصباح.
      </p>
    </div>
  </div>

  <script>
    function showMessage() {
      const startCard = document.getElementById('startCard');
      const letterCard = document.getElementById('letterCard');

      startCard.classList.add('hidden');

      setTimeout(() => {
        startCard.style.display = 'none';
        letterCard.classList.add('show');
      }, 400);
    }
  </script>

</body>
</html>
